<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Responsive Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Navbar -->
    <div class="container-fluid bg-dark">
        <nav class="navbar">
            <a href="../main/main.html">
                <img height="100px" src="https://blog.olx.com.pk/wp-content/uploads/2019/08/Blue-Logo-800x800-01.png" alt="" style="margin-left: 30px;">
            </a>
            <h1 class="text-white pe-5" style="font-family:'Times New Roman', Times, serif;">Product Form</h1>
        </nav>
    </div>

    <!-- Form -->
    <div class="container py-5">
        <div class="row g-3">
            <!-- Product Name -->
            <div class="col-md-6">
                <label for="productName" class="form-label fw-bold" style="font-family: 'Times New Roman', Times, serif;">Product Name</label>
                <input type="text" class="form-control" id="productName" placeholder="Product Name">
            </div>

            <!-- Product Price -->
            <div class="col-md-6">
                <label for="productPrice" class="form-label fw-bold" style="font-family: 'Times New Roman', Times, serif;">Product Price</label>
                <input type="text" class="form-control" id="productPrice" placeholder="Product Price">
            </div>

            <!-- Image URL -->
            <div class="col-md-6">
                <label for="imgUrl" class="form-label fw-bold" style="font-family: 'Times New Roman', Times, serif;">Image URL</label>
                <input type="url" class="form-control" id="imgUrl" placeholder="Image URL">
            </div>

            <!-- Date -->
            <div class="col-md-6">
                <label for="date" class="form-label fw-bold" style="font-family: 'Times New Roman', Times, serif;">Date</label>
                <input type="date" class="form-control" id="date">
            </div>

            <!-- Item Details -->
            <div class="col-12">
                <label for="textArea" class="form-label fw-bold" style="font-family: 'Times New Roman', Times, serif;">Item Details</label>
                <textarea class="form-control" id="textArea" rows="5" placeholder="Item Details"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="col-12">
                <button type="button" onclick="addProduct()" class="btn btn-dark w-20">Submit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="productform.js"></script>
</body>

</html>
