<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .product-details {
                text-align: center;
            }
        }

        .bg-dark img {
            margin-left: 30px;
        }
    </style>
</head>

<body>
    <div class="container-fluid bg-dark">
        <nav class="navbar">
            <a href="../main/main.html">
                <img height="100px" src="https://blog.olx.com.pk/wp-content/uploads/2019/08/Blue-Logo-800x800-01.png" alt="" style="margin-left: 30px;">
            </a>
            <h1 class="text-white pe-5" style="font-family:'Times New Roman', Times, serif;">Product Form</h1>
        </nav>
    </div>

    <div class="container my-5">
        <div class="row">
            <!-- Image Section -->
            <div class="col-lg-6">
                <img src="product.jpg" alt="Product Image" id="image" class="img-fluid">
            </div>

            <!-- Product Details Section -->
            <div class="col-lg-6 product-details">
                <h2 class="fw-bold">Product Name</h2>
                <h3 id="price"><span class="fw-bold">Price:</span> Rs 5000</h3>
                <p id="description"><span class="fw-bold">Description:</span> This is a high-quality product with premium features.</p>
                <p id="condition"><span class="fw-bold">Condition:</span> New</p>
                <p id="location"><span class="fw-bold">Location:</span> Karachi, Pakistan</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="detail.js"></script>
</body>

</html>
